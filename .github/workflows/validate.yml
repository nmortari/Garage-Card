name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check Garage-Door-Control-Card.js
      - name: Check HACS metadata
        run: node -e "JSON.parse(require('fs').readFileSync('hacs.json', 'utf8'))"
